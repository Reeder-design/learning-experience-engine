name: Component Builder Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'builders/component-web/**'
      - 'content/demos/components/**'
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'docs/workbench/**'
      - 'docs/component-studio/**'
      - 'docs/course-composer/**'
      - 'docs/scenario-builder/**'
      - 'docs/user-guide/**'
      - 'scripts/preview-docs.js'
      - 'schemas/component.schema.json'
      - 'schemas/course.schema.json'
      - 'tests/component-builder.test.js'
      - 'tests/docs-navigation.test.js'
      - 'themes/**'
      - 'package.json'
      - '.github/workflows/component-smoke.yml'
  pull_request:
    paths:
      - 'builders/component-web/**'
      - 'content/demos/components/**'
      - 'docs/index.html'
      - 'docs/assets/**'
      - 'docs/workbench/**'
      - 'docs/component-studio/**'
      - 'docs/course-composer/**'
      - 'docs/scenario-builder/**'
      - 'docs/user-guide/**'
      - 'scripts/preview-docs.js'
      - 'schemas/component.schema.json'
      - 'schemas/course.schema.json'
      - 'tests/component-builder.test.js'
      - 'tests/docs-navigation.test.js'
      - 'themes/**'
      - 'package.json'
      - '.github/workflows/component-smoke.yml'

jobs:
  component-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check browser runtime syntax
        run: |
          node --check builders/component-web/runtime.js
          node --check builders/component-web/scenario-runtime.js
          node --check docs/assets/app-registry.js
          node --check docs/assets/id-workbench.js
          node --check docs/workbench/workbench.js
          node --check docs/component-studio/studio.js
          node --check docs/component-studio/asset-library.js
          node --check docs/component-studio/workflow.js
          node --check docs/component-studio/project-package.js
          node --check docs/component-studio/help.js
          node --check docs/course-composer/composer.js
          node --check docs/course-composer/workflow.js
          node --check docs/course-composer/course-package.js
          node --check docs/scenario-builder/scenario-builder.js
          node --check docs/scenario-builder/scenario-package.js
          node --check scripts/preview-docs.js

      - name: Validate static docs navigation and Workbench UX
        run: node tests/docs-navigation.test.js

      - name: Smoke test local docs preview
        run: |
          PREVIEW_NO_OPEN=1 PORT=4173 node scripts/preview-docs.js > /tmp/lx-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/experience-engine-favicon.svg > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/favicon.ico > /dev/null

      - name: Run component builder smoke tests
        run: npm test
