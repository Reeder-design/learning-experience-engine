name: Component Builder Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'builders/component-web/**'
      - 'content/demos/components/**'
      - 'docs/component-studio/**'
      - 'docs/user-guide/**'
      - 'schemas/component.schema.json'
      - 'tests/component-builder.test.js'
      - 'themes/**'
      - 'package.json'
      - '.github/workflows/component-smoke.yml'
  pull_request:
    paths:
      - 'builders/component-web/**'
      - 'content/demos/components/**'
      - 'docs/component-studio/**'
      - 'docs/user-guide/**'
      - 'schemas/component.schema.json'
      - 'tests/component-builder.test.js'
      - 'themes/**'
      - 'package.json'
      - '.github/workflows/component-smoke.yml'

jobs:
  component-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check browser runtime syntax
        run: |
          node --check builders/component-web/runtime.js
          node --check docs/component-studio/studio.js
          node --check docs/component-studio/asset-library.js
          node --check docs/component-studio/project-package.js
          node --check docs/component-studio/help.js

      - name: Run component builder smoke tests
        run: npm test
