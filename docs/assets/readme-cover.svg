<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Learning Experience Engine</title>
  <desc id="desc">Source material flows through a project workbench into an editable learner preview, with three connected visual panels.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#2e3735"/><stop offset=".5" stop-color="#42645e"/><stop offset="1" stop-color="#204a50"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="0"><stop stop-color="#79c99e"/><stop offset="1" stop-color="#b8eb7e"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#e6fff1" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#dots)"/>
  <circle cx="1135" cy="20" r="260" fill="#a7e9a5" opacity=".08"/>
  <text x="62" y="76" fill="#cbebd6" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LEARNING EXPERIENCE ENGINE  /  ACTIVE PROTOTYPE</text>
  <text x="62" y="164" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="800">Start with your source.</text>
  <text x="62" y="231" fill="#bcf18c" font-family="Arial, sans-serif" font-size="56" font-weight="800">Shape the experience.</text>
  <text x="62" y="280" fill="#e1f1e7" font-family="Arial, sans-serif" font-size="22">Build, edit, and preview learning in one connected workspace.</text>
  <path d="M62 325H1138" stroke="url(#edge)" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(62 359)"><rect width="310" height="151" rx="18" fill="#f6fff9"/><rect x="18" y="18" width="50" height="50" rx="11" fill="#dbf5e4"/><path d="M30 32h26M30 43h22M30 54h27" stroke="#3b7c74" stroke-width="4" stroke-linecap="round"/><text x="84" y="48" fill="#31564e" font-size="20" font-weight="800">01 / SOURCE</text><text x="22" y="98" fill="#3e6259" font-size="18">Templates · files · existing projects</text><rect x="22" y="116" width="99" height="13" rx="6" fill="#9bd8b4"/><rect x="131" y="116" width="72" height="13" rx="6" fill="#b8e6bd"/></g>
    <g transform="translate(445 359)"><rect width="310" height="151" rx="18" fill="#f6fff9"/><rect x="18" y="18" width="50" height="50" rx="11" fill="#dbf5e4"/><rect x="29" y="30" width="28" height="27" rx="3" fill="none" stroke="#3b7c74" stroke-width="4"/><path d="M35 40h16M35 48h12" stroke="#3b7c74" stroke-width="3"/><text x="84" y="48" fill="#31564e" font-size="20" font-weight="800">02 / WORKBENCH</text><text x="22" y="98" fill="#3e6259" font-size="18">Edit content and interaction logic</text><rect x="22" y="116" width="154" height="13" rx="6" fill="#9bd8b4"/><rect x="186" y="116" width="88" height="13" rx="6" fill="#b8e6bd"/></g>
    <g transform="translate(828 359)"><rect width="310" height="151" rx="18" fill="#f6fff9"/><rect x="18" y="18" width="50" height="50" rx="11" fill="#dbf5e4"/><path d="M29 35l10 14 18-22" fill="none" stroke="#3b7c74" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="48" fill="#31564e" font-size="20" font-weight="800">03 / PREVIEW</text><text x="22" y="98" fill="#3e6259" font-size="18">Check the learner experience</text><rect x="22" y="116" width="74" height="13" rx="6" fill="#9bd8b4"/><rect x="106" y="116" width="153" height="13" rx="6" fill="#b8e6bd"/></g>
  </g>
  <path d="M382 435h50m-15-13 15 13-15 13M765 435h50m-15-13 15 13-15 13" stroke="#bcf18c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
